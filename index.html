<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xello AI - Powered by Groq</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0B3A3D;
            --bg-secondary: #062C2F;
            --text-primary: #FFFFFF;
            --text-secondary: #D1D5DB;
            --accent-cyan: #2EF2E2;
            --accent-teal: #1EC9A6;
            --input-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --message-user: linear-gradient(135deg, #1EC9A6, #2EF2E2);
            --message-assistant: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, var(--bg-secondary), var(--bg-primary));
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(6, 44, 47, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(to right, #2EF2E2, #1EC9A6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #hamburger {
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        #sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(6, 44, 47, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            transition: left 0.3s ease;
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        #sidebar.open {
            left: 0;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #new-chat-btn {
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-teal));
            color: #062C2F;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }

        .nav-links a {
            display: block;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .nav-links a.active {
            background: var(--message-user);
            color: #062C2F;
            font-weight: 600;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .feature-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .feature-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chat-container {
            height: calc(100vh - 180px);
            display: flex;
            flex-direction: column;
        }

        #chatHistory, #visionHistory {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .message {
            max-width: 80%;
            margin-bottom: 24px;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: var(--message-user);
            color: #062C2F;
            border-bottom-right-radius: 4px;
            margin-left: auto;
        }

        .assistant-message {
            align-self: flex-start;
            background: var(--message-assistant);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 50px;
            max-height: 200px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            flex: 1;
            min-width: 150px;
        }

        button.send-btn {
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-teal));
            color: #062C2F;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .output {
            margin-top: 20px;
            padding: 16px;
            background: var(--message-assistant);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            white-space: pre-wrap;
        }

        img.vision-img {
            max-width: 100%;
            border-radius: 12px;
            margin: 16px 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            #hamburger { font-size: 1.5rem; }
            .controls { flex-direction: column; }
            select, button.send-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <div id="sidebar">
        <div id="sidebar-header">
            <h2 style="margin:0; font-size:1.2rem;">Xello AI</h2>
            <i class="fas fa-times" style="cursor:pointer; font-size:1.4rem;" onclick="closeSidebar()"></i>
        </div>
        <button id="new-chat-btn" onclick="newChat(); setActiveSection('chat-completion')">
            <i class="fas fa-plus"></i> New Chat
        </button>
        <div class="nav-links">
            <a href="#chat-completion" onclick="setActiveSection('chat-completion')" class="active">Chat</a>
            <a href="#text-generation" onclick="setActiveSection('text-generation')">Text Generation</a>
            <a href="#vision" onclick="setActiveSection('vision')">Image Analysis</a>
            <a href="#compound-ai" onclick="setActiveSection('compound-ai')">Compound AI</a>
            <a href="#models-list" onclick="setActiveSection('models-list')">Available Models</a>
        </div>
    </div>

    <header>
        <div class="header-content">
            <i id="hamburger" class="fas fa-bars" onclick="openSidebar()"></i>
            <h1>Xello AI</h1>
            <div></div>
        </div>
    </header>

    <main>
        <div id="chat-completion" class="feature-section active">
            <div class="chat-container">
                <div id="chatHistory"></div>
                <div class="input-area">
                    <textarea id="chatPrompt" placeholder="Send a message..." oninput="autoResize(this)"></textarea>
                    <div class="controls">
                        <select id="chatModel">
                            <option value="llama-3.1-8b-instant">Llama 3.1 8B (Fast)</option>
                            <option value="llama-3.3-70b-versatile" selected>Llama 3.3 70B (Best)</option>
                            <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
                            <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
                            <option value="qwen/qwen3-32b">Qwen3 32B (Preview)</option>
                            <option value="moonshotai/kimi-k2-instruct-0905">Kimi K2 0905 (Preview)</option>
                        </select>
                        <button class="send-btn" onclick="handleChatCompletion()">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="text-generation" class="feature-section">
            <h2>Text Generation</h2>
            <div class="input-area">
                <textarea id="responsePrompt" placeholder="Enter your prompt..."></textarea>
                <div class="controls">
                    <select id="responseModel">
                        <option value="llama-3.3-70b-versatile" selected>Llama 3.3 70B</option>
                        <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
                        <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
                        <option value="qwen/qwen3-32b">Qwen3 32B</option>
                    </select>
                    <button class="send-btn" onclick="handleResponse()">Generate</button>
                </div>
            </div>
            <div id="responseOutput" class="output"></div>
        </div>

        <div id="vision" class="feature-section">
            <div class="chat-container">
                <div id="visionHistory"></div>
                <div class="input-area">
                    <input type="file" id="visionImage" accept="image/*" style="color:var(--text-primary);">
                    <textarea id="visionPrompt" placeholder="Ask about the image... (optional if image uploaded)" oninput="autoResize(this)"></textarea>
                    <div class="controls">
                        <select id="visionModel">
                            <option value="meta-llama/llama-4-maverick-17b-128e-instruct" selected>Llama 4 Maverick (Multimodal)</option>
                            <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout (Multimodal)</option>
                        </select>
                        <button class="send-btn" onclick="handleVision()">Analyze</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="compound-ai" class="feature-section">
            <div class="chat-container">
                <div id="compoundHistory"></div>
                <div class="input-area">
                    <textarea id="compoundPrompt" placeholder="Ask anything (uses tools like search/code if needed)..." oninput="autoResize(this)"></textarea>
                    <div class="controls">
                        <select id="compoundModel">
                            <option value="groq/compound" selected>Compound (Full)</option>
                            <option value="groq/compound-mini">Compound Mini</option>
                        </select>
                        <button class="send-btn" onclick="handleCompound()">Run</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="models-list" class="feature-section">
            <h2>Available Models</h2>
            <button class="send-btn" onclick="listModels()">Refresh List</button>
            <div id="modelsOutput" class="output"></div>
        </div>
    </main>

    <script>
        const BASE_URL = 'https://api.groq.com/openai/v1';
        const API_KEY = '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';

        let chatHistory = [];
        let visionHistory = [];
        let compoundHistory = [];

        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        function setActiveSection(sectionId) {
            document.querySelectorAll('.feature-section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.querySelector(`a[href="#${sectionId}"]`).classList.add('active');
            closeSidebar();
        }

        function newChat() {
            chatHistory = [];
            document.getElementById('chatHistory').innerHTML = '';
            document.getElementById('chatPrompt').value = '';
        }

        function addMessage(container, role, content, imageUrl = null) {
            const history = document.getElementById(container);
            const div = document.createElement('div');
            div.className = `message ${role}-message`;
            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.className = 'vision-img';
                div.appendChild(img);
            }
            div.appendChild(document.createTextNode(content));
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        async function apiRequest(endpoint, body, isFormData = false) {
            const headers = { 'Authorization': `Bearer ${API_KEY}` };
            if (!isFormData) headers['Content-Type'] = 'application/json';

            const response = await fetch(`${BASE_URL}${endpoint}`, {
                method: 'POST',
                headers,
                body: isFormData ? body : JSON.stringify(body)
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(`API Error ${response.status}: ${err}`);
            }
            return response.json();
        }

        async function handleChatCompletion() {
            const prompt = document.getElementById('chatPrompt').value.trim();
            if (!prompt) return;

            addMessage('chatHistory', 'user', prompt);
            chatHistory.push({ role: 'user', content: prompt });
            document.getElementById('chatPrompt').value = '';

            try {
                const model = document.getElementById('chatModel').value;
                const data = await apiRequest('/chat/completions', {
                    messages: chatHistory,
                    model,
                    temperature: 0.7,
                    max_tokens: 2048
                });

                const reply = data.choices[0].message.content;
                chatHistory.push({ role: 'assistant', content: reply });
                addMessage('chatHistory', 'assistant', reply);
            } catch (err) {
                addMessage('chatHistory', 'assistant', `Error: ${err.message}`);
            }
        }

        async function handleResponse() {
            const prompt = document.getElementById('responsePrompt').value.trim();
            if (!prompt) return;
            const model = document.getElementById('responseModel').value;
            const output = document.getElementById('responseOutput');
            output.textContent = 'Generating...';
            try {
                const data = await apiRequest('/chat/completions', {
                    messages: [{ role: 'user', content: prompt }],
                    model
                });
                output.textContent = data.choices[0].message.content;
            } catch (err) {
                output.textContent = `Error: ${err.message}`;
            }
        }

        async function handleVision() {
            const fileInput = document.getElementById('visionImage');
            const promptText = document.getElementById('visionPrompt').value.trim() || "Describe this image in detail.";
            if (!fileInput.files[0]) return alert('Please upload an image');

            const imageUrl = URL.createObjectURL(fileInput.files[0]);
            addMessage('visionHistory', 'user', promptText, imageUrl);
            visionHistory.push({ role: 'user', content: [{ type: 'text', text: promptText }, { type: 'image_url', image_url: { url: imageUrl } }] });

            const reader = new FileReader();
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                const model = document.getElementById('visionModel').value;
                try {
                    const data = await apiRequest('/chat/completions', {
                        model,
                        messages: [{ role: 'user', content: [{ type: 'text', text: promptText }, { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64}` } }] }],
                        max_tokens: 1024
                    });
                    const reply = data.choices[0].message.content;
                    visionHistory.push({ role: 'assistant', content: reply });
                    addMessage('visionHistory', 'assistant', reply);
                } catch (err) {
                    addMessage('visionHistory', 'assistant', `Error: ${err.message}`);
                }
            };
            reader.readAsDataURL(fileInput.files[0]);
            document.getElementById('visionPrompt').value = '';
            fileInput.value = '';
        }

        async function handleCompound() {
            const prompt = document.getElementById('compoundPrompt').value.trim();
            if (!prompt) return;

            addMessage('compoundHistory', 'user', prompt);
            compoundHistory.push({ role: 'user', content: prompt });
            document.getElementById('compoundPrompt').value = '';

            try {
                const model = document.getElementById('compoundModel').value;
                const data = await apiRequest('/chat/completions', {
                    messages: compoundHistory,
                    model
                });

                const reply = data.choices[0].message.content;
                compoundHistory.push({ role: 'assistant', content: reply });
                addMessage('compoundHistory', 'assistant', reply);
            } catch (err) {
                addMessage('compoundHistory', 'assistant', `Error: ${err.message}`);
            }
        }

        async function listModels() {
            const output = document.getElementById('modelsOutput');
            output.textContent = 'Fetching current models...';
            try {
                const data = await fetch(`${BASE_URL}/models`, {
                    headers: { 'Authorization': `Bearer ${API_KEY}` }
                }).then(r => r.json());
                const models = data.data.map(m => `${m.id} (${m.owned_by || 'Groq'})`).join('\n');
                output.textContent = models || 'No models returned';
            } catch (err) {
                output.textContent = `Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
