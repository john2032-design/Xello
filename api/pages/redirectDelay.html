<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VortixWorld Luarmor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --blue: #0066ff;
            --glow: rgba(0,102,255,0.7);
            --yellow: #ffff00;
            --yellow-glow: rgba(255,255,0,0.45);
            --yellow-bg: rgba(255,255,0,0.08);
            --yellow-border: rgba(255,255,0,0.45);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            min-height: 100dvh;
            background: linear-gradient(135deg, #000000 0%, #000033 50%, #000022 100%);
            background-size: 400% 400%;
            animation: gradientShift 25.5s ease infinite;
            color: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo {
            font-size: clamp(34px, 8.5vw, 58px);
            font-weight: 700;
            letter-spacing: -2.8px;
            margin-bottom: 52px;
            animation: logoBreathe 6.8s ease-in-out infinite;
            text-shadow: 0 0 30px var(--glow), 0 0 60px var(--glow), 0 4px 20px rgba(0,0,0,0.7);
            will-change: transform;
        }

        @keyframes logoBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        .spinner-container {
            position: relative;
            width: 148px;
            height: 148px;
            margin: 0 auto 32px;
        }

        .loader-wrapper {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 124px;
            height: 124px;
            will-change: transform;
        }

        .loader-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .ring-outer {
            width: 124px;
            height: 124px;
            border: 7px solid rgba(255,255,255,0.09);
            border-top-color: #ffffff;
            animation: spin 1.28s linear infinite;
            box-shadow: 0 0 40px rgba(255,255,255,0.25);
            will-change: transform;
        }

        .ring-inner {
            width: 96px;
            height: 96px;
            border: 6px solid rgba(0,102,255,0.35);
            border-bottom-color: #0066ff;
            animation: spin 2.65s linear infinite reverse;
            will-change: transform;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 148px;
            height: 148px;
        }

        .progress-ring {
            transform: rotate(-90deg);
            will-change: transform;
        }

        .progress-ring__circle-bg {
            fill: transparent;
            stroke: #ffffff15;
            stroke-width: 11;
        }

        .progress-ring__circle {
            fill: transparent;
            stroke: #0066ff;
            stroke-width: 11;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-dashoffset 0.32s linear;
            will-change: stroke-dashoffset;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(72px, 19vw, 118px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -6px;
            text-shadow: 0 10px 40px rgba(0,0,0,0.75);
            transition: all 0.4s ease;
            will-change: transform, color;
        }

        .count-label {
            font-size: clamp(15.5px, 4.2vw, 19.5px);
            font-weight: 500;
            letter-spacing: 2.2px;
            opacity: 0.88;
            margin-bottom: 46px;
        }

        .warning {
            color: var(--yellow);
            background: var(--yellow-bg);
            backdrop-filter: blur(22px);
            border: 1.5px solid var(--yellow-border);
            border-radius: 22px;
            padding: 24px 30px;
            font-size: clamp(15.8px, 4.1vw, 18px);
            font-weight: 600;
            line-height: 1.48;
            box-shadow: 0 18px 45px rgba(0,0,0,0.65);
            animation: warningPulse 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes warningPulse {
            0% { box-shadow: 0 18px 45px rgba(0,0,0,0.65); }
            30% { box-shadow: 0 18px 45px rgba(0,0,0,0.65), inset 0 0 25px var(--yellow-glow); }
            70% { box-shadow: 0 18px 45px rgba(0,0,0,0.65), inset 0 0 25px var(--yellow-glow); }
            100% { box-shadow: 0 18px 45px rgba(0,0,0,0.65); }
        }

        .footer {
            position: absolute;
            bottom: 32px;
            font-size: 13.8px;
            opacity: 0.52;
            letter-spacing: 1px;
        }

        @media (prefers-reduced-motion: reduce) {
            body, .logo, .ring-outer, .ring-inner, .warning { animation: none !important; }
            .progress-ring__circle { transition: none; }
        }

        @media (max-width: 380px) {
            .spinner-container { transform: scale(0.92); }
            .logo { font-size: clamp(30px, 8vw, 52px); }
            #countdown { font-size: clamp(60px, 18vw, 100px); }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            body { padding: 12px; }
            .container { margin-top: -30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">VortixWorld Luarmor</div>
        
        <div class="spinner-container">
            <div class="progress-container">
                <svg class="progress-ring" width="148" height="148" aria-hidden="true">
                    <defs>
                        <filter id="progress-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <circle class="progress-ring__circle-bg" cx="74" cy="74" r="64"/>
                    <circle id="progress-circle" class="progress-ring__circle" cx="74" cy="74" r="64" stroke-dasharray="402" stroke-dashoffset="402" filter="url(#progress-glow)"/>
                </svg>
                <div id="countdown" aria-live="polite" role="timer">25</div>
            </div>

            <div class="loader-wrapper">
                <div class="loader-ring ring-outer"></div>
                <div class="loader-ring ring-inner"></div>
            </div>
        </div>

        <div class="count-label">SECONDS UNTIL REDIRECT</div>
        
        <div class="warning" role="alert">
            ⚠️ Luarmor.net Might Blacklist Continue At Your Own Risk ⚠️
        </div>
    </div>

    <div class="footer">VortixWorld • Secure Delayed Redirect</div>

    <script>
        let timeLeft = 25;
        const countdownEl = document.getElementById('countdown');
        const circle = document.getElementById('progress-circle');
        const circumference = 402;
        const startTime = Date.now();

        function setProgress(percent) {
            const offset = circumference - (percent / 100 * circumference);
            circle.style.strokeDashoffset = offset;
        }

        setProgress(100);

        const timer = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const newTime = Math.max(0, 25 - elapsed);

            if (newTime !== timeLeft) {
                timeLeft = newTime;
                countdownEl.textContent = timeLeft;
                setProgress((timeLeft / 25) * 100);

                if (timeLeft <= 8) {
                    countdownEl.style.color = '#ff3366';
                    countdownEl.style.transform = 'translate(-50%, -50%) scale(1.15)';
                }
            }

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.replace(%TARGET_URL%);
            }
        }, 50);

        const meta = document.createElement('meta');
        meta.httpEquiv = "refresh";
        meta.content = "25; url=" + %TARGET_URL%;
        document.head.appendChild(meta);
    </script>
</body>
</html>
