<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VortixWorld Luarmor</title>
<style>
:root{
  --blue:#0066ff;
  --glow:rgba(0,102,255,0.7);
  --yellow:#ffd84d;
  --yellow-glow:rgba(255,216,77,0.12);
  --yellow-bg:rgba(255,216,77,0.06);
  --yellow-border:rgba(255,216,77,0.22);
  --footer-space:clamp(56px,10vh,96px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#000000 0%,#000033 50%,#000022 100%);
  background-size:400% 400%;
  animation:gradientShift 25.5s ease infinite;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  padding:20px;
  padding-bottom:var(--footer-space);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{
  width:100%;
  max-width:560px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(12px,3.5vw,32px);
  padding:clamp(14px,3.2vw,28px);
  text-align:center;
}
.logo{
  font-size:clamp(28px,6.8vw,56px);
  font-weight:700;
  letter-spacing:-1.6px;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  color:#ffffff;
  text-shadow:none;
  background:none;
}
.loader-ring{
  width:clamp(64px,12vw,96px);
  height:clamp(64px,12vw,96px);
  border:8px solid rgba(255,255,255,0.12);
  border-top-color:#ffffff;
  border-radius:50%;
  animation:spin 1.2s linear infinite;
  box-shadow:0 0 35px rgba(255,255,255,0.3),inset 0 0 20px rgba(0,102,255,0.3);
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
#countdown{
  font-size:clamp(48px,14vw,118px);
  font-weight:700;
  line-height:1;
  letter-spacing:-4px;
  margin-bottom:0;
  transition:all .28s ease;
  word-break:break-word;
  max-width:100%;
  display:block;
}
.count-label{
  font-size:clamp(13px,3.2vw,18px);
  font-weight:600;
  letter-spacing:2px;
  opacity:.9;
}
.warning{
  width:100%;
  max-width:540px;
  color:var(--yellow);
  background:var(--yellow-bg);
  border:1.2px solid var(--yellow-border);
  border-radius:16px;
  padding:16px 20px;
  font-size:clamp(13px,3.4vw,17px);
  font-weight:600;
  line-height:1.4;
  box-shadow:0 14px 35px rgba(0,0,0,0.55);
  backdrop-filter:blur(12px);
  word-break:break-word;
  animation:yellowGlow 6s cubic-bezier(0.4,0,0.2,1) infinite;
}
@keyframes yellowGlow{
  0%{box-shadow:0 14px 35px rgba(0,0,0,0.55); background:rgba(255,216,77,0.06); filter:brightness(1)}
  50%{box-shadow:0 20px 48px rgba(0,0,0,0.60), inset 0 0 14px var(--yellow-glow); background:rgba(255,216,77,0.08); filter:brightness(1.03)}
  100%{box-shadow:0 14px 35px rgba(0,0,0,0.55); background:rgba(255,216,77,0.06); filter:brightness(1)}
}
.footer{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,16px));
  font-size:13.5px;
  opacity:.6;
  letter-spacing:1px;
  padding:6px 12px;
  pointer-events:none;
  background:transparent;
}
@media (max-width:420px){
  .logo{font-size:clamp(22px,8.5vw,34px)}
  #countdown{font-size:clamp(42px,18vw,86px)}
  .warning{padding:12px 14px;border-radius:12px}
  .container{padding:12px;gap:12px}
}
@media (orientation:landscape) and (max-height:520px){
  body{padding:12px;padding-bottom:var(--footer-space)}
  .container{gap:10px;max-width:720px}
  .logo{font-size:28px}
  #countdown{font-size:clamp(36px,12vw,64px)}
}
@media (prefers-reduced-motion:reduce){
  body, .loader-ring, .warning{animation:none}
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">VortixWorld Luarmor</div>
  <div class="loader-ring" aria-hidden="true"></div>
  <div id="countdown" aria-live="polite" role="timer">25</div>
  <div class="count-label">SECONDS UNTIL REDIRECT</div>
  <div class="warning" role="alert">⚠️ Luarmor Might Blacklist Continue At Your Own Risk ⚠️</div>
</div>
<div class="footer">VortixWorld • Luarmor 2026</div>
<script id="target-data" type="application/json" data-b64="%TARGET_B64%"></script>
<script>
function b64DecodeUnicode(s){try{return decodeURIComponent(Array.prototype.map.call(atob(s),function(c){return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);}).join(''))}catch(e){return ''}}
const b64=(document.getElementById('target-data')||{}).dataset?.b64||'';
const TARGET_URL=b64?b64DecodeUnicode(b64):'';
let timeLeft=25;
const countdownEl=document.getElementById('countdown');
countdownEl.textContent=timeLeft;
if(TARGET_URL){
  try{
    const meta=document.createElement('meta');
    meta.httpEquiv="refresh";
    meta.content="25; url="+TARGET_URL;
    document.head.appendChild(meta);
  }catch(e){}
}
const timer=setInterval(function(){
  timeLeft--;
  countdownEl.textContent=timeLeft>=0?timeLeft:0;
  if(timeLeft<=8){
    countdownEl.style.color='#ff3366';
    countdownEl.style.transform='scale(1.12)';
  }else{
    countdownEl.style.color='';
    countdownEl.style.transform='';
  }
  if(timeLeft<=0){
    clearInterval(timer);
    if(TARGET_URL&&TARGET_URL.trim().length>0){
      try{window.location.replace(TARGET_URL)}catch(err){window.location.href=TARGET_URL}
    }else{
      console.error('Redirect target empty; aborting.');
    }
  }
},1000);
</script>
</body>
</html>
